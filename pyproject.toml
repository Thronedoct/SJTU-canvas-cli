[project]
name = "canvas-study"
version = "0.3.0"
description = "通用 Canvas 资源 CLI：课程、作业、文件、课堂视频文字稿与可组合的 JSON 接口"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<15", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
export = ["markdownify>=1.1,<2", "pypdf>=5,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
canvas = "canvas_study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

